services:
  - type: web
    name: clientra
    runtime: node
    buildCommand: npm run render-build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://clientra.me
      - key: CORS_ORIGINS
        value: https://clientra.me,https://www.clientra.me
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
