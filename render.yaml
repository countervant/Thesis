services:
  - type: web
    name: clientra
    runtime: node
    buildCommand: npm run render-build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: clientra-output-storage
      mountPath: /var/data/clientra
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://clientra.me
      - key: CORS_ORIGINS
        value: https://clientra.me,https://www.clientra.me
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_SENDER_EMAIL
        sync: false
      - key: RESEND_SENDER_NAME
        value: Clientra Thesis
      - key: OUTPUT_STORAGE_ROOT
        value: /var/data/clientra
